<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offers Photos - Mono System</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-body: #0f172a;
            --bg-surface: #1e293b;
            --success: #10b981;
            --danger: #ef4444;
            --text-secondary: #94a3b8;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-body);
            color: #f8fafc;
            font-family: 'Tajawal', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .mono-wrapper {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .mono-container {
            background: var(--bg-surface);
            padding: 40px;
            border-radius: 20px;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .mono-container h1 {
            text-align: center;
            margin-top: 0;
            color: #d4af37;
            font-weight: 800;
            margin-bottom: 30px;
            font-size: 2rem;
        }

        .mono-form-group {
            margin-bottom: 25px;
        }

        .mono-form-group label {
            display: block;
            margin-bottom: 10px;
            font-weight: 700;
            font-size: 1.1rem;
        }

        .mono-input {
            width: 100%;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(0, 0, 0, 0.2);
            color: white;
            font-family: inherit;
            font-size: 1rem;
            box-sizing: border-box;
            outline: none;
            transition: 0.3s;
        }

        .mono-input:focus {
            border-color: #d4af37;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.2);
        }

        .toggle-container {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 30px;
            font-size: 1.1rem;
            font-weight: bold;
        }
        
        .switch {
            position: relative;
            display: inline-block;
            width: 60px;
            height: 34px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #334155;
            transition: .4s;
            border-radius: 34px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 26px;
            width: 26px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        .switch input:checked + .slider {
            background-color: var(--success);
        }

        .switch input:checked + .slider:before {
            transform: translateX(26px);
        }
        
        .mono-btn-save {
            background: linear-gradient(135deg, #d4af37, #f5d76e);
            color: #000;
            border: none;
            padding: 15px 20px;
            border-radius: 10px;
            font-size: 1.2rem;
            font-weight: 800;
            font-family: inherit;
            width: 100%;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 5px 15px rgba(212, 175, 55, 0.3);
        }

        .mono-btn-save:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(212, 175, 55, 0.5);
        }

        .mono-btn-save:disabled {
            background: #475569;
            color: #94a3b8;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        .mono-btn-link {
            display: block;
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            text-decoration: none;
            padding: 12px 20px;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 700;
            margin-top: 15px;
            transition: 0.3s;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .mono-btn-link:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .preview-box {
            margin-top: 25px;
            width: 100%;
            height: 250px;
            border-radius: 12px;
            background: rgba(0,0,0,0.3);
            border: 1px dashed rgba(255,255,255,0.2);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: var(--text-secondary);
        }

        .preview-box img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .mono-status-msg {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            font-weight: 700;
            display: none;
            font-size: 1.1rem;
        }

        .mono-status-success {
            background: rgba(16, 185, 129, 0.2);
            color: var(--success);
            border: 1px solid var(--success);
        }

        .mono-status-error {
            background: rgba(239, 68, 68, 0.2);
            color: var(--danger);
            border: 1px solid var(--danger);
        }

        /* Responsive Mobile Styles */
        @media (max-width: 768px) {
            .mono-wrapper {
                padding: 10px;
            }
            .mono-container {
                padding: 20px;
                border-radius: 15px;
            }
            .mono-container h1 {
                font-size: 1.5rem;
                margin-bottom: 20px;
            }
            .mono-form-group label {
                font-size: 0.95rem;
            }
            .mono-input {
                padding: 12px;
                font-size: 0.9rem;
            }
            .toggle-container {
                font-size: 0.95rem;
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }
            .mono-btn-save {
                font-size: 1rem;
                padding: 12px 15px;
            }
            .mono-btn-link {
                font-size: 0.95rem;
                padding: 10px 15px;
            }
            .preview-box {
                height: 180px;
                margin-top: 15px;
            }
        }
    </style>
</head>
<body>

    <div class="mono-wrapper">
        <div class="mono-container">
            <h1>إعدادات النافذة المنبثقة</h1>
            
            <div class="mono-form-group">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                    <label for="imgUrlInput" style="margin-bottom: 0;">رابط الصورة (Image URL):</label>
                    <a href="https://github.com/meralmohamed121022-cyber/photos" target="_blank" style="background: rgba(212, 175, 55, 0.1); color: #d4af37; border: 1px solid #d4af37; padding: 4px 8px; border-radius: 5px; text-decoration: none; font-size: 0.85rem; font-weight: bold; transition: 0.3s;" onmouseover="this.style.background='rgba(212, 175, 55, 0.3)'" onmouseout="this.style.background='rgba(212, 175, 55, 0.1)'">رفع صورة 🔗</a>
                </div>
                <input type="text" id="imgUrlInput" class="mono-input" placeholder="أدخل رابط الصورة هنا..." oninput="updateMonoPreview()">
            </div>

            <div class="toggle-container">
                <label class="switch">
                    <input type="checkbox" id="activeToggle" checked>
                    <span class="slider"></span>
                </label>
                <label for="activeToggle">تفعيل النافذة عند بدء التشغيل</label>
            </div>

            <button class="mono-btn-save" id="monoSaveBtn" onclick="saveMonoSettings()">حفظ الإعدادات بنجاح</button>
            <a href="https://monosystem.vercel.app/" target="_blank" class="mono-btn-link">زيارة الموقع مباشرة 🌐</a>

            <div id="monoStatusMessage" class="mono-status-msg"></div>

            <div class="preview-box" id="previewBox">
                لا توجد صورة حالياً
            </div>
        </div>
    </div>

    <script>
        const WORKER_URL = "https://online.meralmohamed121022.workers.dev/startup-image";

        window.onload = () => {
            loadMonoSettings();
        };

        function loadMonoSettings() {
            const btn = document.getElementById('monoSaveBtn');
            btn.innerText = "جاري التحميل...";
            btn.disabled = true;

            fetch(WORKER_URL)
                .then(res => res.json())
                .then(data => {
                    document.getElementById('imgUrlInput').value = data.imageUrl || "";
                    document.getElementById('activeToggle').checked = data.isActive;
                    updateMonoPreview();
                    btn.innerText = "حفظ الإعدادات بنجاح";
                    btn.disabled = false;
                })
                .catch(err => {
                    showMonoStatus("فشل في تحميل الإعدادات من الخادم!", false);
                    btn.innerText = "حفظ الإعدادات بنجاح";
                    btn.disabled = false;
                });
        }

        function updateMonoPreview() {
            const url = document.getElementById('imgUrlInput').value;
            const box = document.getElementById('previewBox');
            if(url) {
                box.innerHTML = `<img src="${url}" alt="Preview" onerror="this.src=''; this.alt='صورة غير صالحة'">`;
            } else {
                box.innerHTML = "لا توجد صورة حالياً";
            }
        }

        function saveMonoSettings() {
            const imageUrl = document.getElementById('imgUrlInput').value;
            const isActive = document.getElementById('activeToggle').checked;
            const btn = document.getElementById('monoSaveBtn');

            btn.innerText = "جاري الحفظ...";
            btn.disabled = true;

            fetch(WORKER_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ imageUrl, isActive })
            })
            .then(res => res.json())
            .then(data => {
                if(data.success) {
                    showMonoStatus("تم الحفظ وتحديث الأكواد بنجاح!", true);
                } else {
                    showMonoStatus("خطأ: " + (data.error || "حدث خطأ أثناء الحفظ!"), false);
                }
            })
            .catch(err => {
                showMonoStatus("فشل الاتصال بالخادم! تأكد من تحديث الـ Worker", false);
            })
            .finally(() => {
                btn.innerText = "حفظ الإعدادات بنجاح";
                btn.disabled = false;
            });
        }

        function showMonoStatus(msg, isSuccess) {
            const statusEl = document.getElementById('monoStatusMessage');
            statusEl.innerText = msg;
            statusEl.className = 'mono-status-msg ' + (isSuccess ? 'mono-status-success' : 'mono-status-error');
            statusEl.style.display = 'block';
            setTimeout(() => { statusEl.style.display = 'none'; }, 5000);
        }
    </script>
</body>
</html>
