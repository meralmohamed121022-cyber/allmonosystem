<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- PWA Setup -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <link rel="apple-touch-icon" href="https://github.com/meralmohamed121022-cyber/OFFERSTRANS/blob/main/icon.png?raw=true">
    <link rel="icon" type="image/png" href="https://github.com/meralmohamed121022-cyber/OFFERSTRANS/blob/main/icon.png?raw=true">
    
    <title>OffersDash - Professional Login Dashboard</title>
    <!-- Google Fonts (Inter) for English -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- ApexCharts for Charts -->
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    <style>
        :root {
            --bg-body: #0f172a;
            --bg-surface: #1e293b;
            --bg-surface-hover: #334155;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --primary-color: #3b82f6;
            --accent-1: #8b5cf6;
            --accent-2: #ec4899;
            --border-color: #334155;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: 'Inter', sans-serif;
            color: var(--text-primary);
            background-color: transparent;
        }

        .animated-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
            overflow: hidden;
        }

        .animated-bg::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(245, 158, 11, 0.15) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: moveGrid 20s linear infinite;
        }

        @keyframes moveGrid {
            0% { transform: translate(0, 0); }
            100% { transform: translate(50px, 50px); }
        }

        .dashboard-container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
        }
        
        .header-title-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .header-logo {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(139, 92, 246, 0.4);
        }

        .dashboard-header h1 {
            margin: 0;
            font-size: 26px;
            background: linear-gradient(to right, var(--primary-color), var(--accent-1), var(--accent-2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .refresh-btn {
            background: linear-gradient(135deg, var(--primary-color), var(--accent-1));
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.3s ease;
        }

        .refresh-btn:hover {
            opacity: 0.9;
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.4);
            transform: translateY(-2px);
        }

        .grid-container {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 24px;
            margin-bottom: 24px;
        }

        @media (max-width: 900px) {
            body {
                padding: 5px;
            }
            .dashboard-container {
                max-width: 100%;
            }
            .grid-container {
                grid-template-columns: 1fr;
                gap: 12px;
                margin-bottom: 12px;
            }
            .dashboard-header {
                flex-direction: row;
                flex-wrap: wrap;
                gap: 8px;
                align-items: center;
                justify-content: space-between;
                margin-bottom: 15px;
                padding-bottom: 10px;
            }
            .header-title-container {
                gap: 8px;
            }
            .dashboard-header h1 {
                font-size: 16px;
            }
            .header-logo {
                width: 24px;
                height: 24px;
            }
            .refresh-btn {
                padding: 6px 12px;
                font-size: 11px;
                width: 100%;
            }
            .stats-circle-wrapper {
                height: 150px;
            }
            .stats-circle {
                width: 120px;
                height: 120px;
                padding: 4px;
            }
            .total-number {
                font-size: 1.5rem;
            }
            .card {
                padding: 10px;
                border-radius: 10px;
            }
            .card-title {
                font-size: 13px;
                margin-bottom: 12px;
            }
            #searchInput {
                width: 100%;
                padding: 6px 10px;
                font-size: 12px;
            }
            .table-container {
                max-height: 350px;
            }
            th, td {
                padding: 6px 4px;
                font-size: 10px;
            }
            table {
                width: 100%;
                table-layout: fixed;
            }
            th:nth-child(1), td:nth-child(1) {
                width: 35%;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }
            th:nth-child(2), td:nth-child(2) {
                width: 25%;
            }
            th:nth-child(3), td:nth-child(3) {
                width: 20%;
            }
            th:nth-child(4), td:nth-child(4) {
                width: 20%;
            }
            .badge {
                padding: 3px 6px;
                font-size: 10px;
            }
        }

        .card {
            background-color: var(--bg-surface);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            border: 1px solid var(--border-color);
        }

        .card-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-top: 0;
            margin-bottom: 24px;
        }

        /* Stats Circle */
        .stats-circle-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 250px;
        }

        .stats-circle {
            position: relative;
            width: 220px;
            height: 220px;
            border-radius: 50%;
            background: conic-gradient(var(--primary-color), var(--accent-1), var(--accent-2), var(--primary-color));
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 8px;
            box-shadow: 0 0 25px rgba(139, 92, 246, 0.25);
        }

        .stats-circle-inner {
            width: 100%;
            height: 100%;
            background-color: var(--bg-surface);
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 2;
        }

        .total-number {
            font-size: 3.5rem;
            font-weight: 700;
            margin: 0;
            line-height: 1;
            text-shadow: 0 0 15px rgba(59, 130, 246, 0.4);
        }

        /* Table */
        .table-container {
            overflow-x: auto;
            max-height: 500px;
            overflow-y: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            table-layout: fixed;
        }

        th:nth-child(1), td:nth-child(1) {
            width: 40%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        th:nth-child(2), td:nth-child(2) { width: 20%; }
        th:nth-child(3), td:nth-child(3) { width: 20%; }
        th:nth-child(4), td:nth-child(4) { width: 20%; }

        th, td {
            padding: 16px;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            background-color: rgba(15, 23, 42, 0.9);
            color: var(--text-secondary);
            font-weight: 600;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        tr {
            transition: background-color 0.2s;
        }

        tr:hover td {
            background-color: var(--bg-surface-hover);
        }

        .badge {
            background-color: rgba(16, 185, 129, 0.2);
            color: #34d399;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
        }

        .loading-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 23, 42, 0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            color: white;
            font-size: 24px;
            font-weight: bold;
            display: none;
            backdrop-filter: blur(5px);
        }
        
        /* Scrollbar styles */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-body); 
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border-color); 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-secondary); 
        }
    </style>
</head>
<body>
    <div class="animated-bg"></div>

    <div class="loading-overlay" id="loading">Loading data from server...</div>

    <div class="dashboard-container">
        <div class="dashboard-header">
            <div class="header-title-container">
                <img src="https://github.com/meralmohamed121022-cyber/OFFERSTRANS/blob/main/icon.png?raw=true" alt="OffersDash Logo" class="header-logo">
                <h1>OffersDash</h1>
            </div>
            <button class="refresh-btn" onclick="fetchData()">Refresh Data</button>
        </div>

        <div class="grid-container">
            <!-- Total Count -->
            <div class="card">
                <h2 class="card-title">Total Logins</h2>
                <div class="stats-circle-wrapper">
                    <div class="stats-circle">
                        <div class="stats-circle-inner">
                            <div class="total-number" id="total-count">0</div>
                            <div style="color: var(--text-secondary); margin-top: 10px; font-size: 16px;">Users Logged In</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Chart -->
            <div class="card">
                <h2 class="card-title">Login Trend (Last 7 Days)</h2>
                <div id="loginChart"></div>
            </div>
        </div>

        <!-- Data Table -->
        <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 15px;">
                <h2 class="card-title" style="margin-bottom: 0;">Recent Login Records</h2>
                <input type="text" id="searchInput" placeholder="Search Pharmacy Number..." style="padding: 10px 16px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-body); color: var(--text-primary); outline: none; width: 250px; font-family: 'Inter', sans-serif; font-size: 14px;">
            </div>
            <div class="table-container">
                <table id="logs-table">
                    <thead>
                        <tr>
                            <th>Pharmacy Number</th>
                            <th>Date</th>
                            <th>Time</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="table-body">
                        <!-- Data will be injected here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://uzydzvfcrlqmtondugte.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV6eWR6dmZjcmxxbXRvbmR1Z3RlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY3OTA1MzMsImV4cCI6MjA5MjM2NjUzM30.z7-eKWrYjW9cbzTcoyyKprgXbcqCHk_kF6ETHokudzo';

        let chart;
        let allLogsData = [];

        function fuzzyMatch(pattern, str) {
            const escapedPattern = pattern.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const regexPattern = '.*' + escapedPattern.split('').join('.*') + '.*';
            const re = new RegExp(regexPattern, 'i');
            return re.test(str);
        }

        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
        }

        function formatTime(dateString) {
            const date = new Date(dateString);
            return date.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: true });
        }

        async function fetchData() {
            document.getElementById('loading').style.display = 'flex';
            
            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/login_logs?select=*&order=login_time.desc&limit=1000`, {
                    method: 'GET',
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`
                    }
                });

                if (!response.ok) throw new Error('Failed to fetch data');

                const data = await response.json();
                allLogsData = data;
                
                const totalCountElement = document.getElementById('total-count');
                animateValue(totalCountElement, parseInt(totalCountElement.innerText) || 0, data.length, 1000);

                updateTable(data);
                updateChart(data);

            } catch (error) {
                console.error('Error:', error);
                alert('Error fetching data. Please check your internet connection.');
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        }

        function updateTable(data) {
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';

            if(data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" style="text-align: center; color: var(--text-secondary);">No data available</td></tr>';
                return;
            }

            data.forEach(log => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td style="font-weight: 700; color: var(--primary-color);">${log.pharmacy_number}</td>
                    <td>${formatDate(log.login_time)}</td>
                    <td style="font-family: monospace; font-size: 15px;">${formatTime(log.login_time)}</td>
                    <td><span class="badge">Success</span></td>
                `;
                tbody.appendChild(tr);
            });
        }

        function updateChart(data) {
            const countsByDate = {};
            
            for(let i=6; i>=0; i--) {
                const d = new Date();
                d.setDate(d.getDate() - i);
                const dateStr = d.toISOString().split('T')[0];
                countsByDate[dateStr] = 0;
            }

            data.forEach(log => {
                const dateStr = new Date(log.login_time).toISOString().split('T')[0];
                if(countsByDate[dateStr] !== undefined) {
                    countsByDate[dateStr]++;
                }
            });

            const categories = Object.keys(countsByDate).map(date => {
                return new Date(date).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
            });
            const seriesData = Object.values(countsByDate);

            const options = {
                series: [{
                    name: 'Logins',
                    data: seriesData
                }],
                chart: {
                    type: 'area',
                    height: 280,
                    fontFamily: 'Inter, sans-serif',
                    toolbar: { show: false },
                    background: 'transparent'
                },
                colors: ['#8b5cf6'],
                fill: {
                    type: 'gradient',
                    gradient: {
                        shadeIntensity: 1,
                        opacityFrom: 0.6,
                        opacityTo: 0.1,
                        stops: [0, 90, 100]
                    }
                },
                dataLabels: { enabled: false },
                stroke: {
                    curve: 'smooth',
                    width: 3,
                    colors: ['#8b5cf6']
                },
                xaxis: {
                    categories: categories,
                    labels: { style: { colors: '#94a3b8', fontSize: '13px' } },
                    axisBorder: { show: false },
                    axisTicks: { show: false }
                },
                yaxis: {
                    labels: { 
                        style: { colors: '#94a3b8' },
                        formatter: function (val) {
                            return Math.floor(val);
                        }
                    }
                },
                grid: {
                    borderColor: '#334155',
                    strokeDashArray: 4,
                },
                theme: { mode: 'dark' },
                tooltip: {
                    theme: 'dark'
                }
            };

            if (chart) {
                chart.destroy();
            }
            
            chart = new ApexCharts(document.querySelector("#loginChart"), options);
            chart.render();
        }

        function animateValue(obj, start, end, duration) {
            let startTimestamp = null;
            const step = (timestamp) => {
                if (!startTimestamp) startTimestamp = timestamp;
                const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                obj.innerHTML = Math.floor(progress * (end - start) + start);
                if (progress < 1) {
                    window.requestAnimationFrame(step);
                } else {
                    obj.innerHTML = end;
                }
            };
            window.requestAnimationFrame(step);
        }

        document.getElementById('searchInput').addEventListener('input', function(e) {
            const query = e.target.value.trim();
            if (query === '') {
                updateTable(allLogsData);
            } else {
                const filteredData = allLogsData.filter(log => {
                    return fuzzyMatch(query, String(log.pharmacy_number));
                });
                updateTable(filteredData);
            }
        });

        document.addEventListener('DOMContentLoaded', fetchData);
    </script>
</body>
</html>
