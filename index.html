<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>لوحة المشاريع</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="https://github.com/meralmohamed121022-cyber/OFFERSTRANS/blob/main/icon.png?raw=true" type="image/png">
    <link rel="apple-touch-icon" href="https://github.com/meralmohamed121022-cyber/OFFERSTRANS/blob/main/icon.png?raw=true">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --dark-blue: #0f172a;
            --medium-blue: #1e3a8a;
            --light-blue: #3b82f6;
            --orange: #f59e0b;
            --dark-orange: #ea580c;
            --white: #ffffff;
            --gray: #94a3b8;
            --light-gray: #cbd5e1;
            --shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Tajawal', 'Poppins', sans-serif;
            background-color: var(--dark-blue);
            background-image: 
                radial-gradient(circle at 0% 0%, rgba(245, 158, 11, 0.15) 0px, transparent 50%),
                radial-gradient(circle at 100% 100%, rgba(30, 58, 138, 0.15) 0px, transparent 50%);
            color: var(--white);
            min-height: 100vh;
            padding: 2rem;
            transition: padding 0.3s ease;
        }

        /* Fullscreen Mode Overrides */
        body:has(.fullscreen-mode) {
            padding: 0;
            overflow: hidden;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 2rem;
            height: calc(100vh - 4rem);
            transition: all 0.3s ease;
        }

        .container.fullscreen-mode {
            max-width: 100%;
            height: 100vh;
            gap: 0;
        }

        header {
            text-align: center;
            padding: 1rem 0;
        }

        header h1 {
            font-size: 2.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--white), var(--orange));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        header p {
            color: var(--gray);
            font-size: 1.1rem;
        }

        /* Responsive Grid: Auto-fit on desktop/tablet, 2 columns on mobile */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 1.25rem;
            margin-top: 1.5rem;
        }

        .card {
            background: rgba(30, 58, 138, 0.25);
            border: 1px solid rgba(245, 158, 11, 0.2);
            backdrop-filter: blur(10px);
            border-radius: 18px;
            padding: 1.5rem;
            display: flex;
            align-items: center;
            gap: 1.2rem;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            color: var(--white);
            text-align: right;
            box-shadow: 0 8px 35px rgba(0, 0, 0, 0.3);
            outline: none;
            font-family: inherit;
        }

        .card:hover {
            transform: translateY(-6px);
            border-color: var(--orange);
            background: rgba(30, 58, 138, 0.45);
            box-shadow: 0 15px 45px rgba(245, 158, 11, 0.35);
        }

        .card:active {
            transform: scale(0.97);
        }

        .card-icon {
            font-size: 2.2rem;
            background: linear-gradient(135deg, var(--orange), var(--dark-orange));
            padding: 0.8rem;
            border-radius: 50%;
            border: 3px solid var(--dark-blue);
            box-shadow: 0 0 20px rgba(245, 158, 11, 0.5);
            color: var(--white);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 70px;
            height: 70px;
            flex-shrink: 0;
            transition: transform 0.3s ease;
        }

        .card:hover .card-icon {
            transform: scale(1.08) rotate(3deg);
        }

        .card-content h2 {
            font-size: 1.35rem;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .iframe-container {
            flex: 1;
            background: var(--dark-blue);
            width: 100%;
            height: 100%;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .iframe-container.hidden {
            display: none;
        }

        #content-frame {
            width: 100%;
            height: 100%;
            border: none;
            background: white;
        }

        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(15, 23, 42, 0.95);
            padding: 1rem 2rem;
            border-radius: 2rem;
            border: 1px solid var(--orange);
            color: var(--orange);
            font-weight: bold;
            z-index: 10;
            backdrop-filter: blur(5px);
            transition: opacity 0.3s;
            box-shadow: 0 10px 25px rgba(245, 158, 11, 0.4);
        }

        .loading.hidden {
            opacity: 0;
            pointer-events: none;
        }

        /* Back Button */
        .back-btn {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: linear-gradient(135deg, var(--orange), var(--dark-orange));
            color: var(--white);
            border: none;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            font-size: 1.8rem;
            cursor: pointer;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 25px rgba(245, 158, 11, 0.4);
            transition: all 0.3s;
        }

        .back-btn:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 12px 35px rgba(245, 158, 11, 0.6);
        }

        .back-btn.hidden {
            display: none;
        }

        /* Mobile Responsive Rule (كل اتنين قصاد بعض في الموبايل) */
        @media (max-width: 680px) {
            body {
                padding: 1rem 0.75rem;
            }
            .container {
                padding: 0;
                gap: 1rem;
                height: auto;
            }
            header {
                padding: 0.5rem 0;
            }
            header h1 {
                font-size: 2.1rem;
            }
            header p {
                font-size: 0.95rem;
            }
            /* كل اتنين قصاد بعض */
            .cards-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 0.75rem;
                margin-top: 1rem;
            }
            .card {
                padding: 1.1rem 0.6rem;
                gap: 0.7rem;
                flex-direction: column;
                text-align: center;
                border-radius: 16px;
            }
            .card-icon {
                width: 54px;
                height: 54px;
                font-size: 1.6rem;
                border-width: 2px;
            }
            .card-content h2 {
                font-size: 1.05rem;
                word-break: break-word;
            }
            .back-btn {
                bottom: 1.25rem;
                right: 1.25rem;
                width: 52px;
                height: 52px;
                font-size: 1.5rem;
            }
        }

        /* Tablet Responsive Rule */
        @media (min-width: 681px) and (max-width: 992px) {
            .cards-grid {
                grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
                gap: 1rem;
            }
            .card {
                padding: 1.25rem 1rem;
            }
        }
    </style>
</head>
<body>
    <button id="back-btn" class="back-btn hidden" onclick="goHome()" title="العودة للرئيسية">
        🏠
    </button>

    <div id="main-container" class="container">
        <header id="main-header">
            <h1>مشاريعي</h1>
            <p>اختر أحد الأنظمة لعرضه بملء الشاشة</p>
        </header>
        
        <div id="cards-grid" class="cards-grid">
            <!-- الروابط الأربعة الجديدة المطلوبة -->
            <button class="card" onclick="loadUrl('https://dawaview.vercel.app/')">
                <div class="card-icon">👁️</div>
                <div class="card-content">
                    <h2>dawaview</h2>
                </div>
            </button>

            <button class="card" onclick="loadUrl('https://monopos.vercel.app/')">
                <div class="card-icon">💳</div>
                <div class="card-content">
                    <h2>monopos</h2>
                </div>
            </button>

            <button class="card" onclick="loadUrl('https://mononr.vercel.app/')">
                <div class="card-icon">🧾</div>
                <div class="card-content">
                    <h2>mononr</h2>
                </div>
            </button>

            <button class="card" onclick="loadUrl('https://cloudaldawaa.vercel.app/?mode=admin')">
                <div class="card-icon">☁️</div>
                <div class="card-content">
                    <h2>cloudaldawaa</h2>
                </div>
            </button>

            <!-- المشاريع السابقة المتبقية -->
            <button class="card" onclick="loadUrl('./Offers Trans.html')">
                <div class="card-icon">🚀</div>
                <div class="card-content">
                    <h2>Offers Trans</h2>
                </div>
            </button>

            <button class="card" onclick="loadUrl('./Offers Dash.html')">
                <div class="card-icon">📊</div>
                <div class="card-content">
                    <h2>Offers Dash</h2>
                </div>
            </button>

            <button class="card" onclick="loadUrl('https://projectlocator.vercel.app/')">
                <div class="card-icon">📍</div>
                <div class="card-content">
                    <h2>Project Locator</h2>
                </div>
            </button>

            <button class="card" onclick="loadUrl('./offers_photos.html')">
                <div class="card-icon">📸</div>
                <div class="card-content">
                    <h2>Offers Photos</h2>
                </div>
            </button>
        </div>

        <div id="iframe-container" class="iframe-container hidden">
            <div id="loading" class="loading hidden">جاري التحميل...</div>
            <iframe id="content-frame" src="about:blank" title="Project Preview" allowfullscreen allow="camera *; microphone *; autoplay; fullscreen" scrolling="yes"></iframe>
        </div>
    </div>

    <script>
        const iframeContainer = document.getElementById('iframe-container');
        const contentFrame = document.getElementById('content-frame');
        const loading = document.getElementById('loading');
        const mainHeader = document.getElementById('main-header');
        const cardsGrid = document.getElementById('cards-grid');
        const backBtn = document.getElementById('back-btn');
        const mainContainer = document.getElementById('main-container');

        function loadUrl(url) {
            // Hide home elements
            mainHeader.style.display = 'none';
            cardsGrid.style.display = 'none';
            
            // Transform container to fullscreen mode
            mainContainer.classList.add('fullscreen-mode');
            
            // Show iframe and back button
            iframeContainer.classList.remove('hidden');
            backBtn.classList.remove('hidden');
            loading.classList.remove('hidden');
            
            // Set URL
            contentFrame.src = url;
            
            // Hide loading when done
            contentFrame.onload = () => {
                loading.classList.add('hidden');
            };
        }

        function goHome() {
            // Clear iframe
            contentFrame.src = 'about:blank';
            
            // Show home elements
            mainHeader.style.display = 'block';
            cardsGrid.style.display = 'grid'; // because it's a grid
            
            // Revert container
            mainContainer.classList.remove('fullscreen-mode');
            
            // Hide iframe and back button
            iframeContainer.classList.add('hidden');
            backBtn.classList.add('hidden');
        }
    </script>
</body>
</html>
